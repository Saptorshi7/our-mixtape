<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Mixtape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #f08aa8;
    --cream: #fff4ea;
    --soft: #e6cfd9;
    --serif: "Cormorant Garamond", "Noto Serif Bengali", Georgia, "Times New Roman", serif;
    --script: "Caveat", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: #1b1022;
    color: var(--cream);
    font-family: var(--serif);
    font-size: 1.1rem;
    line-height: 1.5;
  }

  /* blurred, enlarged copy of the picture fills the whole screen */
  .bgwrap { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  #bg {
    position: absolute; inset: -8%; width: 116%; height: 116%;
    filter: blur(28px) saturate(1.25) brightness(0.62);
  }

  /* the sharp pixel picture, as big as the screen allows */
  .stage {
    position: relative; z-index: 1;
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    animation: rise 0.9s ease both;
  }
  #art { display: block; image-rendering: pixelated; box-shadow: 0 0 90px rgba(0, 0, 0, 0.5); }
  /* scenes drawn for any size fill the whole screen edge to edge */
  body.full .stage { overflow: hidden; animation: none; }
  body.full #art { box-shadow: none; flex: none; }
  body.full .year { text-shadow: 0 2px 10px rgba(60, 20, 30, 0.75); }
  @keyframes rise { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }

  .back {
    position: fixed; z-index: 3; top: 14px; left: 14px; padding: 6px 16px; border-radius: 999px; font-size: 1rem;
    color: var(--cream); text-decoration: none;
    background: rgba(24, 12, 30, 0.55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    transition: background 0.25s;
  }
  .back:hover { background: rgba(240, 138, 168, 0.55); }
  .year {
    position: fixed; z-index: 3; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: var(--script); font-size: 2.1rem; color: var(--cream);
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
  }

  /* the music player at the bottom */
  .bar {
    position: relative; z-index: 2;
    padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    background: rgba(24, 12, 30, 0.74);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255, 255, 255, 0.14);
  }
  .deck { max-width: 520px; margin: 0 auto; display: grid; gap: 8px; justify-items: center; }
  .now { font-size: 1.05rem; color: var(--cream); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .now .artist { color: var(--soft); font-style: italic; }
  .now .artist::before { content: " \00b7  "; font-style: normal; }
  .controls { display: flex; align-items: center; gap: 22px; }
  .ctl {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
    border: 0; background: none; color: var(--cream); cursor: pointer; padding: 0;
    transition: color 0.2s, background 0.2s, transform 0.15s;
  }
  .ctl svg { width: 22px; height: 22px; fill: currentColor; }
  .ctl:hover { color: var(--rose); }
  .ctl:active { transform: scale(0.92); }
  .ctl.off { opacity: 0.3; pointer-events: none; }
  .ctl.play { width: 56px; height: 56px; background: var(--cream); color: #1b1022; box-shadow: 0 4px 22px rgba(240, 138, 168, 0.35); }
  .ctl.play svg { width: 24px; height: 24px; }
  .ctl.play:hover { background: var(--rose); color: #1b1022; }
  .ctl.play .i-pause { display: none; }
  body.playing .ctl.play .i-play { display: none; }
  body.playing .ctl.play .i-pause { display: block; }
  .progress { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--soft); font-variant-numeric: tabular-nums; }
  .progress[hidden] { display: none; }
  .line { flex: 1; height: 16px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .line .rail { position: relative; width: 100%; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); }
  .line .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--rose); }
  .line .knob { position: absolute; top: 50%; left: 0; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--cream); }
  .hint { margin: 0; font-size: 0.85rem; color: var(--soft); font-style: italic; }
  .hint:empty { display: none; }
  /* the YouTube player stays hidden behind everything; only its sound is used */
  #yt { position: fixed; left: 0; bottom: 0; width: 200px; height: 113px; opacity: 0; pointer-events: none; z-index: -1; }

  @media (prefers-reduced-motion: reduce) { .stage { animation: none; } }
</style>
</head>
<body>
<div class="bgwrap"><canvas id="bg" width="32" height="32" aria-hidden="true"></canvas></div>

<a class="back" href="index.html">&lsaquo; our mixtape</a>
<div class="year" id="year"></div>
<div class="stage" id="stage">
  <canvas id="art" width="32" height="32" role="img"></canvas>
</div>

<div class="bar">
  <div class="deck">
    <div class="now"><span id="title"></span><span class="artist" id="artist"></span></div>
    <div class="controls">
      <a class="ctl" id="prev" href="#" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></a>
      <button class="ctl play" id="play" type="button" aria-label="Play">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <a class="ctl" id="next" href="#" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></a>
    </div>
    <div class="progress" id="progress" hidden>
      <span id="cur">0:00</span>
      <div class="line" id="line"><div class="rail"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div></div>
      <span id="dur">0:00</span>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</div>
<div id="yt"></div>

<script src="tracks.js"></script>
<script src="scenes.js"></script>
<script>
const q = parseInt(new URLSearchParams(location.search).get("i"), 10);
const i = Number.isInteger(q) && q >= 0 && q < TRACKS.length ? q : 0;
const tr = TRACKS[i];

document.title = tr.title + " · For Spandita";
document.getElementById("year").textContent = tr.year;
document.getElementById("title").textContent = tr.title;
const artistEl = document.getElementById("artist");
if (tr.artist) artistEl.textContent = tr.artist; else artistEl.remove();

// ---------- the player ----------
const params = new URLSearchParams(location.search);
const wantAutoplay = params.get("play") === "1";
const playBtn = document.getElementById("play"), hint = document.getElementById("hint");
const prev = document.getElementById("prev"), next = document.getElementById("next");
const progress = document.getElementById("progress"), line = document.getElementById("line");
const fillEl = document.getElementById("fill"), knob = document.getElementById("knob");
const curEl = document.getElementById("cur"), durEl = document.getElementById("dur");
let playing = false;

// previous / next keep the music going if it was playing
const go = j => { location.href = "track.html?i=" + j + (playing ? "&play=1" : ""); };
if (i > 0) prev.href = "track.html?i=" + (i - 1); else prev.classList.add("off");
if (i < TRACKS.length - 1) next.href = "track.html?i=" + (i + 1); else next.classList.add("off");
prev.addEventListener("click", e => { e.preventDefault(); if (i > 0) go(i - 1); });
next.addEventListener("click", e => { e.preventDefault(); if (i < TRACKS.length - 1) go(i + 1); });

const link = tr.link || "";
const ytId = (link.match(/(?:youtu\.be\/|[?&]v=|\/embed\/)([\w-]{11})/) || [])[1];
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const setPlaying = on => { playing = on; document.body.classList.toggle("playing", on); playBtn.setAttribute("aria-label", on ? "Pause" : "Play"); };
const last = TRACKS.length - 1;

// The song plays from its own file first (audio/1.mp3 ... audio/8.mp3, or tr.audio).
// If that file isn't there, it falls back to the hidden YouTube player, then to opening the link.
let eng = null, ended = false, dragging = false;
function finished() {
  if (ended) return;
  ended = true; setPlaying(false);
  if (i < last) location.href = "track.html?i=" + (i + 1) + "&play=1";
}
function tick() {
  if (!eng || !eng.ready() || dragging) return;
  const d = eng.dur() || 0, c = eng.time() || 0;
  durEl.textContent = fmt(d); curEl.textContent = fmt(c);
  fillEl.style.width = knob.style.left = (d ? (c / d) * 100 : 0) + "%";
}
setInterval(tick, 250);

function startAudio() {
  const a = new Audio();
  a.preload = "metadata";
  eng = {
    kind: "audio", ready: () => true,
    play: () => { setPlaying(true); a.play().catch(() => setPlaying(false)); },
    pause: () => a.pause(),
    time: () => a.currentTime, dur: () => a.duration, seek: t => { a.currentTime = t; }
  };
  progress.hidden = false;
  a.addEventListener("loadedmetadata", () => { durEl.textContent = fmt(a.duration); });
  a.addEventListener("play", () => { setPlaying(true); disarm(); });
  a.addEventListener("pause", () => setPlaying(false));
  a.addEventListener("ended", finished);
  a.addEventListener("timeupdate", tick);
  a.addEventListener("error", () => { a.removeAttribute("src"); setPlaying(false); startFallback(); }, { once: true });
  a.src = tr.audio || "audio/" + (i + 1) + ".mp3";
  // start straight away; if the browser won't allow sound before a tap, the first tap anywhere starts it
  setPlaying(true);
  a.play().catch(() => { if (!a.error) { setPlaying(false); arm(); } });
}

let armed = null;
function arm() {
  hint.textContent = "Tap anywhere to play \u2665";
  armed = e => {
    if (e.target.closest && e.target.closest(".controls, .back, .line")) return; // those buttons do their own thing
    disarm();
    if (eng && !playing) eng.play();
  };
  document.addEventListener("pointerdown", armed, true);
  document.addEventListener("keydown", armed, true);
}
function disarm() {
  if (!armed) return;
  document.removeEventListener("pointerdown", armed, true);
  document.removeEventListener("keydown", armed, true);
  armed = null;
  if (hint.textContent.startsWith("Tap anywhere")) hint.textContent = "";
}

function startFallback() {
  eng = null;
  if (ytId) startYouTube();
  else if (!link || link === "#") { progress.hidden = true; playBtn.classList.add("off"); hint.textContent = "This song is on its way."; }
  else progress.hidden = true;   // play opens the link in a new tab
}

function startYouTube() {
  let yt = null, ok = false, broken = false;
  eng = {
    kind: "yt", ready: () => ok && !broken,
    play: () => { yt.playVideo(); setPlaying(true); },
    pause: () => { yt.pauseVideo(); setPlaying(false); },
    time: () => yt.getCurrentTime(), dur: () => yt.getDuration(), seek: t => yt.seekTo(t, true)
  };
  // keep the button in step with what YouTube is actually doing (its events are not always delivered)
  const sync = st => {
    if (st === 1 || st === 3) { setPlaying(true); hint.textContent = ""; }
    else if (st === 2 || st === 5) setPlaying(false);
    else if (st === 0) finished();
  };
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player("yt", {
      videoId: ytId,
      playerVars: { playsinline: 1, controls: 0, rel: 0, disablekb: 1, origin: location.origin },
      events: {
        onReady: () => { ok = true; durEl.textContent = fmt(yt.getDuration()); if (wantAutoplay) yt.playVideo(); },
        onStateChange: e => sync(e.data),
        onError: () => { broken = true; eng = null; setPlaying(false); progress.hidden = true; hint.textContent = "Tap play to listen on YouTube."; }
      }
    });
    setInterval(() => { if (ok && !broken && yt.getPlayerState) sync(yt.getPlayerState()); }, 250);
  };
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.append(tag);
}

// tap or drag on the line to jump
const seekTo = (x, commit) => {
  if (!eng || !eng.ready()) return;
  const r = line.getBoundingClientRect(), k = Math.min(1, Math.max(0, (x - r.left) / r.width));
  fillEl.style.width = knob.style.left = k * 100 + "%";
  const d = eng.dur() || 0;
  curEl.textContent = fmt(k * d);
  if (commit && d) eng.seek(k * d);
};
line.addEventListener("pointerdown", e => { dragging = true; line.setPointerCapture(e.pointerId); seekTo(e.clientX, false); });
line.addEventListener("pointermove", e => { if (dragging) seekTo(e.clientX, false); });
line.addEventListener("pointerup", e => { if (dragging) { dragging = false; seekTo(e.clientX, true); } });

function toggle() {
  if (eng) {
    if (!eng.ready()) { hint.textContent = "Loading the song…"; return; }
    if (playing) eng.pause(); else eng.play();
  } else if (link && link !== "#") window.open(link, "_blank", "noopener");
}
startAudio();
playBtn.addEventListener("click", toggle);

addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && i > 0) go(i - 1);
  if (e.key === "ArrowRight" && i < TRACKS.length - 1) go(i + 1);
  if (e.key === " " && e.target === document.body) { e.preventDefault(); toggle(); }
  if (e.key === "Escape") location.href = "index.html";
});

// the picture, drawn small and shown big, plus a blurred copy behind it
const art = document.getElementById("art"), bg = document.getElementById("bg");
const actx = art.getContext("2d"), bctx = bg.getContext("2d");
art.setAttribute("aria-label", "Animated pixel art for " + tr.title);
const stage = document.getElementById("stage");
const draw = SCENES[tr.scene];
const full = !!draw.fullscreen;
if (full) document.body.classList.add("full");
function fit() {
  if (full) {
    // whole screen: pick a pixel size so the short side is ~44 art pixels, then cover everything
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const s = Math.max(1, Math.floor(Math.min(sw, sh) / 44));
    const w = Math.max(32, Math.ceil(sw / s)), h = Math.max(32, Math.ceil(sh / s));
    if (art.width !== w || art.height !== h) { art.width = bg.width = w; art.height = bg.height = h; }
    art.style.width = w * s + "px"; art.style.height = h * s + "px";
    return;
  }
  const s = Math.min(stage.clientWidth, stage.clientHeight);
  const px = s >= 64 ? Math.floor(s / 32) * 32 : s;
  art.style.width = art.style.height = px + "px";
}
fit(); addEventListener("resize", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(t) {
  draw(actx, reduce ? 0 : t, art.width, art.height);
  bctx.drawImage(art, 0, 0);
  if (!reduce) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
