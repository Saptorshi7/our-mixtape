<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Spandita: Our Mixtape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fbeee9;
    --bg2: #f3d9de;
    --paper: #fffaf5;
    --ink: #4a2c3a;
    --muted: #8c6b78;
    --rose: #c75b7a;
    --gold: #c9a063;
    --serif: "Cormorant Garamond", "Noto Serif Bengali", Georgia, "Times New Roman", serif;
    --script: "Caveat", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1.15rem;
    line-height: 1.6;
  }

  header { text-align: center; padding: 72px 20px 32px; }
  .eyebrow { font-family: var(--script); font-size: 1.5rem; color: var(--rose); margin: 0; }
  header h1 {
    margin: 4px 0 0;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.01em;
  }
  .divider { color: var(--gold); margin: 14px 0 0; letter-spacing: 0.6em; font-size: 0.9rem; }
  .sub { margin: 10px 0 0; color: var(--muted); font-style: italic; }

  main { max-width: 720px; margin: 0 auto; padding: 16px 20px 96px; display: grid; gap: 40px; }

  .track {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 28px;
    align-items: center;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .track.in { opacity: 1; transform: none; }
  .track:nth-child(even) { grid-template-columns: 1fr 200px; }
  .track:nth-child(even) .photo { order: 2; --rot: 2deg; }
  .track:nth-child(even) .text { text-align: right; }

  .photo {
    position: relative;
    display: block;
    background: var(--paper);
    padding: 10px 10px 34px;
    border-radius: 3px;
    box-shadow: 0 10px 28px rgba(120, 60, 80, 0.22), 0 1px 3px rgba(120, 60, 80, 0.2);
    transform: rotate(var(--rot, -2deg));
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .photo:hover, .photo:focus-visible {
    transform: rotate(var(--rot, -2deg)) translateY(-6px) scale(1.04);
    box-shadow: 0 18px 38px rgba(120, 60, 80, 0.3), 0 2px 4px rgba(120, 60, 80, 0.2);
  }
  .photo:focus-visible { outline: 2px solid var(--rose); outline-offset: 5px; }
  .cap {
    position: absolute; left: 0; right: 0; bottom: 7px;
    text-align: center; line-height: 1;
    font-family: var(--script); font-size: 1.1rem; color: var(--rose);
  }
  .photo canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    image-rendering: pixelated;
    background: #3a2440;
  }

  .num { font-family: var(--script); font-size: 1.35rem; color: var(--rose); }
  .text h2 { margin: 0; font-size: 1.7rem; font-weight: 600; line-height: 1.2; }
  .artist { margin: 2px 0 0; color: var(--muted); font-style: italic; }
  .note { margin: 12px 0 14px; }
  .play {
    display: inline-block;
    padding: 6px 20px;
    border: 1px solid var(--rose);
    border-radius: 999px;
    color: var(--rose);
    text-decoration: none;
    font-size: 1rem;
    transition: background 0.25s, color 0.25s;
  }
  .play:hover { background: var(--rose); color: #fff; }

  footer { text-align: center; padding: 0 20px 64px; font-family: var(--script); font-size: 1.6rem; color: var(--rose); }

  @media (max-width: 560px) {
    .track, .track:nth-child(even) { grid-template-columns: 1fr; gap: 18px; }
    .track:nth-child(even) .photo { order: 0; }
    .track:nth-child(even) .text { text-align: left; }
    .photo { max-width: 260px; margin: 0 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
<header>
  <p class="eyebrow">for my love, Spandita</p>
  <h1>Our Mixtape</h1>
  <p class="divider">&#10084; &#10084; &#10084;</p>
  <p class="sub">10 November &middot; the songs that hold our moments</p>
</header>

<main id="tracks"></main>

<footer>Happy anniversary &#10084;</footer>

<script src="tracks.js"></script>
<script src="scenes.js"></script>
<script>
const root = document.getElementById("tracks");
const live = [];

TRACKS.forEach((tr, i) => {
  const href = "track.html?i=" + i;
  const el = document.createElement("article");
  el.className = "track";

  const photo = document.createElement("a");
  photo.className = "photo"; photo.href = href;
  photo.setAttribute("aria-label", "Open " + tr.title + ", " + tr.year);
  const canvas = document.createElement("canvas");
  canvas.width = 32; canvas.height = 32;
  canvas.setAttribute("aria-hidden", "true");
  const cap = document.createElement("span");
  cap.className = "cap"; cap.textContent = "open me \u2665";
  photo.append(canvas, cap);

  const text = document.createElement("div"); text.className = "text";
  const num = document.createElement("div"); num.className = "num"; num.textContent = tr.year;
  const h = document.createElement("h2"); h.textContent = tr.title;
  const a = document.createElement("p"); a.className = "artist"; a.textContent = tr.artist;
  const n = document.createElement("p"); n.className = "note"; n.textContent = tr.note;
  const p = document.createElement("a"); p.className = "play"; p.href = href; p.textContent = "\u25B6 Play";
  text.append(num, h, ...(tr.artist ? [a] : []), n, p);

  el.append(photo, text);
  root.append(el);
  live.push({ ctx: canvas.getContext("2d"), draw: SCENES[tr.scene] });
});

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { threshold: 0.15 });
document.querySelectorAll(".track").forEach(el => io.observe(el));

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(t) {
  live.forEach(s => s.draw(s.ctx, reduce ? 0 : t));
  if (!reduce) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
